<!--
  CourseSentry Login Page
  
  This is the primary authentication entry point for the CourseSentry application.
  It handles user login with username/password credentials and redirects to the
  appropriate interface based on user role (admin or operator).
  
  Features:
  - Responsive login form with autocomplete support
  - Real-time error feedback
  - Auto-redirect for authenticated sessions
  - Role-based routing to admin or operator interfaces
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourseSentry — Login</title>
  <!-- Base URL is dynamically calculated to support deployment in subdirectories -->
  <base href="/">
  <link rel="icon" href="img/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/theme.css">
  <!-- Theme CSS is loaded from settings, allows user-selected theme -->
  <link id="rt-theme-css" rel="stylesheet">
  <style>
    /* Overrides the shared 100vh single-child centering so the live-races
       section can sit below the login box without clipping when present. */
    .login-wrap { flex-direction: column; height: auto; min-height: 100vh; gap: 24px; padding: 24px 16px; }
    .lr-section { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .lr-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--text2); }
    .lr-cards { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .lr-card {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; cursor: pointer; text-decoration: none; transition: border-color 0.15s, background 0.15s;
    }
    .lr-card:hover { border-color: var(--accent); background: var(--surface3); }
    .lr-card-name { font-weight: 700; color: var(--text); }
    .lr-card-date { font-size: 13px; color: var(--text2); }
    .lr-archive-link { color: var(--text2); font-size: 13px; text-decoration: none; }
    .lr-archive-link:hover { color: var(--text); text-decoration: underline; }
  </style>
</head>
<body style="overflow:auto">
  <div class="login-wrap">
    <div class="login-box">
      <h1><img class="logo-reversed" src="img/logo-reversed.svg" alt="CourseSentry" style="max-width:100%;height:auto"><img class="logo-color" src="img/logo-color.svg" alt="CourseSentry" style="max-width:100%;height:auto"></h1>
      <p>Race Safety &amp; Tracking System</p>

      <!-- Login form with username and password inputs -->
      <div class="form-group">
        <label>USERNAME</label>
        <input type="text" id="username" autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>

      <!-- Sign in button and error message display -->
      <button class="primary w100" onclick="login()" style="margin-top:4px">SIGN IN</button>
      <div class="login-error" id="login-error"></div>
    </div>

    <!-- Public directory of races an admin has opted into a viewer link for.
         Lets someone who's only been given the bare hostname find a race
         without needing a link or a login. -->
    <div class="lr-section hidden" id="lr-section">
      <div class="lr-title">LIVE RACES</div>
      <div class="lr-cards" id="lr-cards"></div>
    </div>
    <a class="lr-archive-link" id="lr-archive-link" href="past-races.html">View Past Races &rarr;</a>
  </div>

  <script>
    /**
     * Dynamically calculates the base URL path to support deployment in subdirectories
     * Extracts the first path segment if it's not a filename (doesn't contain a dot)
     * @returns {string} Base URL path with trailing slash (e.g., '/CourseSentry/' or '/')
     */
    const _base = (() => {
      const segment = location.pathname.split('/')[1];
      return segment && !segment.includes('.') ? '/' + segment + '/' : '/';
    })();

    /**
     * Authenticates user with provided credentials and redirects to appropriate interface
     * Validates input, submits to /api/auth/login, and routes based on user role
     * @async
     */
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');

      // Clear any previous error messages
      errorEl.textContent = '';

      // Validate required fields
      if (!username || !password) {
        errorEl.textContent = 'Enter username and password.';
        return;
      }

      try {
        // Submit credentials to authentication endpoint
        const response = await fetch(_base + 'api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const result = await response.json();

        // Check for authentication success
        if (!result.ok) {
          errorEl.textContent = result.error;
          return;
        }

        // Route to appropriate interface based on user role
        const role = result.data.role;
        const destination = role === 'admin' ? 'admin.html' : 'race-select.html';
        window.location.href = _base + destination;
      } catch (error) {
        errorEl.textContent = 'Connection error.';
      }
    }

    /**
     * Allow Enter key to trigger login (standard form behavior)
     */
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') login();
    });

    /**
     * Auto-redirect authenticated users to their respective interfaces
     * Prevents authenticated users from seeing the login form
     */
    fetch(_base + 'api/auth/me')
      .then(response => response.json())
      .then(result => {
        if (result.ok) {
          const destination = result.data.role === 'admin' ? 'admin.html' : 'race-select.html';
          window.location.href = _base + destination;
        }
      })
      .catch(() => {
        // User is not authenticated, stay on login page
      });

    document.getElementById('lr-archive-link').href = _base + 'past-races.html';

    /**
     * Loads the public race directory (races an admin has enabled a viewer
     * link for) and renders active ones as clickable cards. No auth required.
     */
    async function loadLiveRaces() {
      try {
        const response = await fetch(_base + 'api/races/public');
        const result = await response.json();
        if (!result.ok) return;

        const active = result.data.filter(r => r.status === 'active');
        if (!active.length) return;

        const cards = document.getElementById('lr-cards');
        for (const race of active) {
          const card = document.createElement('a');
          card.className = 'lr-card';
          card.href = _base + 'view/' + race.viewer_token;

          const name = document.createElement('div');
          name.className = 'lr-card-name';
          name.textContent = race.name;

          const date = document.createElement('div');
          date.className = 'lr-card-date';
          date.textContent = race.date;

          card.appendChild(name);
          card.appendChild(date);
          cards.appendChild(card);
        }
        document.getElementById('lr-section').classList.remove('hidden');
      } catch (error) {
        // Directory is a convenience, not critical — fail silently and leave the section hidden.
      }
    }

    loadLiveRaces();
  </script>
</body>
</html>
